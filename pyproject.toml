[project]
name = "familydb"
version = "0.1.0"
description = "A private family planning assistant: an ideas log, calendar plans and weekend suggestions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7,<2",
    "apscheduler>=3.11,<4",
    "flask>=3.1,<4",
    "google-api-python-client>=2.190",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-genai>=1.0",
    "openai>=2,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.15",
    "python-telegram-bot>=22,<23",
    "typer>=0.27",
    "tzdata",
    "waitress>=3.0",
]

[project.scripts]
familydb = "familydb.cli:run_cli"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familydb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "A", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Anthropic API (needs FAMILYDB_LIVE=1 and ANTHROPIC_API_KEY)",
]
