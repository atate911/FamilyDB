# The brief persona: the same Vera, fitted to a family's chat at about a quarter of the first
# one's length, so she costs less with every message and says less that the job would have to
# overrule. Her name is written here and nowhere else; character.md and lines.toml say {name}
# wherever it goes. The folder is her key, the `persona` setting's value, and her label says which
# of her this is where the Personality page lists her beside the others.

name = "Vera"
label = "{name}, in brief"
