{# Connects Google Calendar: the key and the calendar's id. Setup passes `then` to return to the step. #}
{% from "_ui.html" import icon with context %}
<form class="form form--tight" method="post" action="{{ url_for('settings.google_connect') }}" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}" />
  {% if then %}<input type="hidden" name="then" value="{{ then }}" />{% endif %}
  <div class="field"><label class="field__label" for="google-key-file">Choose the file it saved</label>
    <input id="google-key-file" type="file" name="key_file" accept=".json,application/json" aria-describedby="google-key-file-h" />
    <span class="field__hint" id="google-key-file-h">It ends in .json, usually in Downloads.</span></div>
  <div class="field"><label class="field__label" for="google-key">Or paste what is in it</label>
    <textarea id="google-key" name="key" rows="4" autocomplete="off" placeholder='{"type": "service_account", "client_email": "…", …}'></textarea></div>
  <div class="field"><label class="field__label" for="google-calendar">The calendar’s id</label>
    <input id="google-calendar" name="calendar_id" type="text" autocomplete="off" required value="{{ google.calendar or '' }}" placeholder="…@group.calendar.google.com" /></div>
  <div class="actions"><button class="btn btn--primary" type="submit">{{ icon('plug') }}Connect</button></div>
</form>
