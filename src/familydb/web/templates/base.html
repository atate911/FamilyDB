<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_title }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="{{ url_for('web.ideas') }}">{{ site_title }}</a>
      <nav>
        <a href="{{ url_for('web.ideas') }}">Ideas</a>
        <a href="{{ url_for('web.restaurants') }}">Restaurants</a>
        <a href="{{ url_for('web.plans') }}">Plans</a>
        <a href="{{ url_for('settings.show') }}">Settings</a>
      </nav>
      {% if password_in_use() and session.get('signed_in') %}
        <form method="post" action="{{ url_for('auth.logout') }}">
          <button class="quiet" type="submit">Sign out</button>
        </form>
      {% endif %}
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
