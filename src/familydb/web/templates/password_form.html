{# The family password form, on the Sign-in and security settings page, where the answer comes
   back to. #}
<form class="form" method="post" action="{{ url_for('settings.change_password') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}" />
  <input type="hidden" name="section" value="security" />
  {% if password.needs_current %}
    <div class="field wide">
      <label for="pw-current">The password you use now</label>
      <input id="pw-current" name="current" type="password" autocomplete="current-password" required />
    </div>
  {% endif %}
  <div class="field">
    <label for="pw-new">New family password</label>
    <input id="pw-new" name="new" type="password" autocomplete="new-password" required
           minlength="{{ password.least }}" maxlength="200" />
    <p class="muted hint">At least {{ password.least }} characters.</p>
  </div>
  <div class="field">
    <label for="pw-again">The same again</label>
    <input id="pw-again" name="again" type="password" autocomplete="new-password" required
           minlength="{{ password.least }}" maxlength="200" />
  </div>
  <div class="field wide actions"><button type="submit">Save the password</button></div>
</form>
