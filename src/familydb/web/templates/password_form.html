{# The family password form, on the Sign-in and security settings page, where the answer comes back to. #}
{% from "_kitchen.html" import icon with context %}
<form class="form form--tight mt-4" method="post" action="{{ url_for('settings.change_password') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}" />
  <input type="hidden" name="section" value="security" />
  {% if password.needs_current %}
    <div class="field"><label class="field__label" for="pw-current">The password you use now</label>
      <input id="pw-current" type="password" name="current" autocomplete="current-password" required /></div>
  {% endif %}
  <div class="form__row">
    <div class="field"><label class="field__label" for="pw-new">New family password</label>
      <input id="pw-new" type="password" name="new" autocomplete="new-password" required minlength="{{ password.least }}" maxlength="200" aria-describedby="pw-new-h" />
      <span class="field__hint" id="pw-new-h">At least {{ password.least }} characters.</span></div>
    <div class="field"><label class="field__label" for="pw-again">The same again</label>
      <input id="pw-again" type="password" name="again" autocomplete="new-password" required minlength="{{ password.least }}" maxlength="200" /></div>
  </div>
  <div class="actions"><button class="btn btn--primary" type="submit">{{ icon('lock') }}Save the password</button></div>
</form>
