rip in 6 days\") and a green wire drops out of the monitor into the Coming up timeline.\n- Big numerals head each section (\"4 To do 3 late\", \"12 Ideas, lately added\").\n- On To do, a large \"4 OPEN\" numeral sits over a left filter rail.", "doesnt": "- The Coming up timeline repeats exactly what the CRT just listed.\n- The right column is empty for about 450 px under Coming up.\n- The other pages are the X01 pages with the new font.", "beautiful": "Home, the green wire from the bottom of the CRT into the \"NOW\" node of Coming up.", "ugly": "Home, the duplicated plan list (CRT, then timeline) next to the empty right column.", "markText": "It has typographic punch, but the Home duplicates content and leaves a hole."}, "C": {"what": "The X01 terminal with a condensed display face and a two-column Home.", "works": "The condensed headline has punch. The setup card lists all three steps in full. The \"12 Ideas, lately added\" cards get a coloured left edge by kind (amber restaurant, teal trip, green outing). To do adds a left rail with a big \"4 OPEN\" and Open / Done / Cancelled / All filters, which is the best filter treatment in the plain terminal group.", "doesnt": "Home shows the same four plans twice. The CRT \"NEXT UP\" panel now lists all four, and the \"Coming up\" timeline directly below repeats them. The right column then runs out, leaving about 450 px of empty space beside \"To do\" and \"The kids' wishes\". The rest of the site is essentially X01.", "beautiful": "To do, the left rail: a huge condensed \"4\" over \"OPEN\", with the status filters stacked under it.", "ugly": "Home, the duplicated plan list and the dead right column under it.", "markText": "One good page and one clumsy Home, with nothing new elsewhere."}}}, "fin-track": {"marks": {"B": 5.0, "C": 5.5}, "words": {"B": {"what": "The CRT family on a slate-blue ground with a soft editorial serif and coloured hairlines on top of each section.", "works": "- Each section has its own colour rule (amber setup, blue Coming up, yellow To do, purple Lately added, pink wishes).\n- Coming up becomes a horizontal timeline.\n- Plans adds a circular week dial (\"3 PLANS \u00b7 2 past \u00b7 Today \u00b7 1 ahead\"), which is inventive.\n- Titles carry counts (\"Plans 5 THIS MONTH\").\n- Ideas filters become pill chips with radio dots.", "doesnt": "- Four type voices fight: serif, sans, mono and a dithered pixel glitch face on \"mind?\".\n- On To do, a full-width glowing green \"Add something to do\" bar is the loudest thing on the page.\n- The radio-dot chips are fiddly.\n- On phone, the \"who is asking?\" select wraps to two lines.", "beautiful": "Plans, the circular week dial with the plan count in the middle.", "ugly": "Home, \"What's on your mind?\" with \"mind?\" in a dithered pixel font beside a serif and a sans.", "markText": "There are lovely parts, but no single voice: it looks like three designs layered."}, "C": {"what": "The terminal look on slate blue, mixing a serif display face, a pixel word and monospace, with lots of glow.", "works": "The Home composer is wired to Vera's avatar by a little cable and says \"Listening \u00b7 watching 4 plans\". \"Coming up\" is a horizontal timeline. Plans has a round \"3 PLANS this week\" dial with past / today / ahead. Ideas turns its filters into toggle chips with LED dots. Status reuses the VU meter.", "doesnt": "Three typographic voices fight: serif \"Things to do\", the pixel and hatched \"mind?\", and mono labels. The pixel \"mind?\" is low in contrast and hard to read. The LED chip wall on Ideas is long. On the phone, \"who is asking?\" wraps to two lines inside its select.", "beautiful": "Plans, the round week dial with its big \"3\".", "ugly": "Home, the hatched pixel \"mind?\" in the headline.", "markText": "Rich parts that don't agree with each other."}}}, "fin-desk": {"marks": {"B": 4.0, "C": 6.0}, "words": {"B": {"what": "The CRT family as a dense control panel: numbered sections, an \"ON THIS PAGE\" contents box, dotted leaders and left-rail widgets.", "works": "- The \"ON THIS PAGE\" index (\"To do \u2026\u2026 4 open \u25ac 3 late\") is a clever summary.\n- Leaders and numbered sections make Home read like a printed menu.\n- On inner pages, the CRT widget and filters sit in a left rail (Ideas radar with numbered dots, Status \"ON THIS PAGE\" with \u25cf\u25cf\u25cf\u25cb meters).\n- The Ideas table is dense and useful.", "doesnt": "- The phone layout overflows on four pages (Ideas confirmed full size). \"Add an idea\" and \"Add a plan\" are cut off at the right edge, titles are truncated (\"Cannon Beach week\", \"Mount St. Helens da\") and the # column is clipped. To do and Status overflow the same way.\n- On desktop, the NEXT UP CRT is half empty perspective grid.\n- The density tips into clutter.", "beautiful": "Home, the \"ON THIS PAGE\" box with dotted leaders and the amber \"3 late\".", "ugly": "Phone Ideas, rows and buttons running off the right edge of the screen.", "markText": "An interesting desktop, but the phone build is broken on most pages."}, "C": {"what": "The terminal look as an instrument panel. Each page has a left column of CRT instruments, and Home has an \"On this page\" index.", "works": "Home's \"ON THIS PAGE\" box lists every section with its count (3 steps \u00b7 3 plans \u00b7 4 open \u2013 3 late \u00b7 12 ideas \u00b7 0 open) plus \"Ready \u00b7 OpenAI \u00b7 gpt-6-luna $2.00 a day\", which is a genuinely useful summary. The Ideas list is a dense ledger of name, kind, drive time, bearing arrow and number. Status has a numbered index with LED dots (\"3 of 4 on\").", "doesnt": "The big Home CRT plots plans by day and hour, but its lower half is an empty perspective floor. The pages are heavy, with frames inside frames. The phone is full of truncation and overflow: to-dos read \"Call the\u2026\", \"Book th\u2026\", \"Buy Ma\u2026\"; ideas read \"Cannon Beach week\", \"Mount St. Helens da\"; and the \"Add a plan\" and \"Add an idea\" buttons and the filter fields run off the right edge.", "beautiful": "Ideas, the ledger rows with drive time and a little bearing arrow.", "ugly": "Phone To do, where every task title is cut to a few letters.", "markText": "Excellent density on desktop, but it fails on the phone."}}}, "fin-grid": {"marks": {"B": 4.0, "C": 5.5}, "words": {"B": {"what": "The CRT family as a sci-fi HUD: grid background, a circuit line down the left joining numbered sections, caps nav (\"00 HOME 01 VERA\") and an \"UP\" node over a perspective floor.", "works": "- The atmosphere is strong.\n- There is a live clock chip (\"NOW 06:58\") on the Coming up line.\n- To do has a due-date dot timeline.\n- Plans uses boxed day cells with an amber outline on today.", "doesnt": "- The Home section numbers run 05, 03, 04, 02 (they are page indexes), so the sequence reads as broken.\n- Three-card rows leave an empty fourth slot, so the right edge is ragged.\n- Ideas cards dim the first word of each title.\n- On Status, the gauge floats above the title.\n- On phone, \"Finish setting up\" is crushed into three lines (\"Finish / setting / up\"), tab labels clip to \"WISHE\" and the header gear is cut off.", "beautiful": "The footer, the glowing \"UP\" node on the perspective grid floor.", "ugly": "Phone Home, the \"Finish / setting / up\" heading crushed against \"ALL THE SETUP STEPS\".", "markText": "It is heavy on effects and light on order, with broken numbering and phone layout."}, "C": {"what": "The terminal pushed to Tron: numbered caps navigation, a circuit trace down the page and a perspective grid floor.", "works": "It has real atmosphere. The condensed \"WHAT'S ON YOUR **MIND?**\" uses a scanline texture in the green word. The vertical trace joins the sections, and the footer ends in a glowing \"UP\" node over a grid floor. The live \"NOW 06:58\" chip on the timeline is a nice touch. On Status, the analog VU needle meter is lovely. The To do timeline puts the due age (\"6 days ago\") beside each node.", "doesnt": "The numbering contradicts itself. The nav says 00 Home \u2026 05 Wishes, but the Home sections run 05, 03, 04, 02, and Status and Settings become \"C\" and \"D\". The setup, wishes and coming-up cards sit in a four-column grid with the last column empty. The phone breaks in several places: \"Finish setting up\" wraps to three lines and is jammed against \"ALL THE SETUP STEPS\", the tab label reads \"WISHE\", the settings gear is clipped at the header edge, and the radar text shows solid green blocks.", "beautiful": "Status, the VU meter: \"$0.00 TODAY\", LIMIT 2.00 and a sweeping needle.", "ugly": "Phone Home, the three-line \"Finish / setting / up\" heading.", "markText": "It is a memorable look, but the system under it (numbering, grid, phone) doesn't hold."}}}, "fin-index": {"marks": {"B": 6.0, "C": 5.0}, "words": {"B": {"what": "The CRT family as a magazine poster: a giant condensed \"WHAT'S ON YOUR MIND?\" and Home sections laid out as spreads with huge titles.", "works": "- The poster headline is unforgettable.\n- Each section is a spread with a coloured end cap on its rule and a big count (\"Ideas 12 SAVED\", \"Plans 4 COMING\").\n- Hatched squares stand in as category swatches.\n- Settings uses big condensed titles in two columns.", "doesnt": "- The hero is roughly 170 px of \"MIND?\" and fills the whole first phone screen.\n- On Home, the Vera section says \"Nothing said yet. Start a message\" while Chat holds four messages.\n- To do titles wrap in a narrow column.\n- The type scale is so loud that the content gets lost.", "beautiful": "Home, the striped glowing \"MIND?\" set huge in condensed caps.", "ugly": "Home, the \"Vera \u00b7 Nothing said yet\" spread, which contradicts the chat.", "markText": "Bold and striking, but more poster than tool."}, "C": {"what": "The terminal look as an editorial poster: a giant \"MIND?\" and numbered sections with colour-capped rules.", "works": "It is bold. \"WHAT'S ON YOUR **MIND?**\" stands about 170 px tall in scanline green. Each Home section (Vera, Ideas, Plans, To do, Wishes) opens on a thin rule with a coloured end cap (green, violet, blue, yellow, pink) and a huge condensed heading. Idea kinds are hatched swatches. To do uses tree connectors and dotted leaders.", "doesnt": "Home says \"01 Vera \u2014 Nothing said yet. Start a message\" while Chat shows four messages, so the page contradicts the data. Numbering mixes systems: 00\u201305, A\u2013D, and phone Settings rows numbered \"D1\u2013D5\". Home is about 2,560 px tall, with much of it black space. The phone tab label is clipped to \"WISHE\".", "beautiful": "Home, the colour-capped section rules over huge condensed headings.", "ugly": "Home, \"Nothing said yet\" in a family that has been chatting.", "markText": "Striking as a poster, weak as an app."}}}}</script>

const src = (id, page, tail) => 'img/' + id + '/' + page + tail + '.webp';

  if (!t) return '';

    if (/^[-*]\s+/.test(l)) { if (!ul) { out += '<ul>'; ul = true; } out += '<li>' + inline + '</li>'; }

}

const GROUPERS = {

};
const LO = 3, HI = 9;
const pct = v => ((v - LO) / (HI - LO) * 100);
function stats(items) {
  const v = items.map(d => d.mean).filter(x => x !== null);
  if (!v.length) return null;
  return {n: v.length, mean: v.reduce((a, b) => a + b, 0) / v.length, min: Math.min(...v), max: Math.max(...v)};
}
function chartRows(groupKey) {
  return GROUPERS[groupKey].rows().map(r => ({...r, st: stats(r.items)})).filter(r => r.st).sort((a, b) => groupKey === 'mode' ? 0 : b.st.mean - a.st.mean);
}
function lanes(items) {
  const sorted = items.filter(d => d.mean !== null).sort((a, b) => a.mean - b.mean), last = [], out = [];
  for (const d of sorted) {
    let l = 0; while (last[l] !== undefined && d.mean - last[l] < 0.28) l++;
    last[l] = d.mean; out.push({d, l});
  }
  return out;
}
function chart() {
  const rows = chartRows(state.by);

    '</div><div class="legend"><span><i class="solid"></i>Warm light</span><span><i class="ring"></i>Dark phosphor</span><span><i class="tick"></i>Group mean</span></div></div><div class="rows">';
  for (const r of rows) {
    const L = lanes(r.items), nl = Math.max(1, ...L.map(x => x.l + 1)), hh = 14 + nl * 18;
    h += '<div class="row"><div class="lab"><b>' + r.name + '</b><span>' + r.st.n + ' design' + (r.st.n === 1 ? '' : 's') + ' · mean ' + fmt(r.st.mean) + ' · ' + fmt(r.st.min) + '–' + fmt(r.st.max) + '</span></div>' +
      '<div class="track grid-lines" data-h="' + hh + '"><span class="mean" data-left="' + pct(r.st.mean) + '"></span>' +
      L.map(({d, l}) => '<button type="button" class="dot ' + (d.look === 'dark' ? 'ring' : '') + '" data-left="' + pct(d.mean) + '" data-top="' + (14 + l * 18 - 2) + '" data-go="' + d.id + '" data-tip="' + esc(d.name) + ': mean ' + fmt(d.mean) + ' (' + MODE[d.mode].short + ', ' + LOOK[d.look] + ', ' + MEDIUM[d.medium] + ')" aria-label="' + esc(d.name) + ', mean ' + fmt(d.mean) + '"></button>').join('') + '</div></div>';
  }
  h += '</div><div class="axis"><div></div><div>' + [3, 4, 5, 6, 7, 8, 9].map(v => '<span data-left="' + pct(v) + '">' + v + '</span>').join('') + '</div></div><div class="readout" id="readout" aria-live="polite">Hover or focus a dot to name the design. Click it to open.</div></div>';
  return h;
}
function twoByTwo() {

function modeCards() {

const FINDINGS = /*FINDINGS*/"<h3 class=\"sec\">What the marks say</h3>\n<p><b>The three judges mostly agree.</b> Their rankings correlate at 0.8 to 0.9. The tomato and green Kitchen Tables lead (8.5 and 8.3), then Afterglow with scanlines (7.7) and Lit Manual, Pared (7.5). At the bottom are the monitor sketch (2.7), the fade sketch (4.0), today\u2019s page (4.3) and the committee\u2019s four finalists (4.8 to 5.5). Two of the three judges put Kitchen Table (green) first or second, and the third put it third. Its marks were 8, 8 and 9.</p>\n<p><b>Look and finish are tangled.</b> Among the mockups, warm light designs average 8.1 and dark phosphor ones 7.4, a gap of 0.6. That is about the size of the judges\u2019 own disagreement on a single design, and there are only three designs on each side. The much bigger gap is between dark mockups (7.4) and dark designs built on the real app (5.4). But the real-app builds that got the most care, Pared (7.5) and Signal (7.2), score as high as the dark mockups. What pulls the rest down is mostly pages that were never styled: raw Status tables, native date and select controls, phone layouts that overflow. It is not the green.</p>\n<p><b>Where the judges liked the retro screen.</b> The dark designs that scored best made the screen carry information. Pared\u2019s dial reads \u201cnext in 1 day\u201d and its stem runs into the Coming up list. Afterglow\u2019s radar plots ideas by drive time with a legend, and it adds \u201cLeave by 12:30\u201d. Where the radar was only decoration, repeated on several pages, they marked it down. Fourteen of the twenty designs share one structure (top bar, composer beside a CRT screen, the same Settings and Status), and the judges said much of that variety is surface.</p>\n<p><b>The identity model.</b> One judge pointed out that the top-bar dark designs assume nobody is signed in: they ask \u201cwho is asking?\u201d in a dropdown. The sidebar designs, light or dark, know it is Sam, greet Sam, and close loops (\u201cVera will ask how it went\u201d). That is a product decision more than a look, and it applies whichever look wins.</p>\n<h3 class=\"sec\">What the modes say</h3>\n<p><b>A short brief beat a long process.</b> The three designers who got only the description average 8.1, the highest of any mode. Telling them the Phosphor idea cost little (7.4). The committee tournament\u2019s four finalists average 5.1, below every from-scratch design and both team entries. The earlier blind panel had marked the same four 6 to 7.5, but against a smaller, easier field. Today\u2019s page is 18th of 20.</p>\n<p><b>Real-app builds can compete.</b> One designer working from review notes (Pared, 7.5) and one team entry (Signal, 7.2) show that a design on the live templates can score with the mockups. The six sketches scored lowest as a group (4.9), which fits their being quick.</p>\n<h3 class=\"sec\">What the marks do not say</h3>\n<p class=\"caveat\"><b>One kind of mind.</b> Every designer and every judge is the same kind of AI. Cream paper, a soft serif and a tomato accent is a look AI design output tends to produce, so the judges may be rewarding what they would have drawn. That says little about what this family would pick. The family\u2019s own taste is the verdict that counts, and it chose Kitchen Table (green).</p>\n<p class=\"caveat\"><b>Pictures, not pages.</b> The judges saw screenshots of seven pages. They could not see motion, hover, focus or real text rendering, and said so. The glow and scanline designs could move by up to a point either way.</p>\n<p class=\"caveat\"><b>Small groups, one prompt each.</b> Three designers per from-scratch group, one set of instructions, and every warm design is a mockup. A warm design built on the real pages has not been made, so look and medium are not separated.</p>\n";
function modesView() {
  return '<div class="decision"><b>Decision.</b> Kitchen Table (green), \u2605, is the look chosen for FamilyDB. Phosphor stays a design system in its own right; this is a verdict on this app, not on the idea.</div>' +
    '<div class="head"><h1>Modes compared</h1><p class="lede">Seven ways the designs were made, set against three blind judges’ marks. Each dot is one design, at its mean mark across the judges who saw it.</p></div>' +
    chart() +
    '<div class="two"><div class="head"><h3 class="sec">Look and medium together</h3><p class="lede">Mean mark, with the number of designs in brackets. The empty cell is the catch: every warm design is a mockup, so look and medium cannot be told apart in these marks.</p>' + twoByTwo() + '</div></div>' +
    '<div class="head"><h3 class="sec">The seven modes</h3></div>' + modeCards() +

    '<p class="lede">Judge 1 saw sixteen designs; Judges 2 and 3 saw twenty, with the four committee finalists added, each in a different shuffled order. All three were given only a role (an expert graphic and interface designer), a three-sentence description of the app and the pictures. Marks are out of 10.</p>';
}

function applyPos() {
  document.querySelectorAll('[data-left]').forEach(el => { el.style.left = el.dataset.left + '%'; });
  document.querySelectorAll('[data-top]').forEach(el => { el.style.top = el.dataset.top + 'px'; });
  document.querySelectorAll('[data-h]').forEach(el => { el.style.height = el.dataset.h + 'px'; });
}
function render() {
  const id = state.id, isDetail = !VIEWS.includes(id);
  $('view').innerHTML = id === 'overview' ? overview() : id === 'modes' ? modesView() : id === 'scores' ? scores() : detail();
  document.querySelectorAll('#rail a').forEach(a => a.setAttribute('aria-current', a.dataset.go === id ? 'true' : 'false'));
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.page === state.page ? 'true' : 'false'));
  const showPageControls = isDetail || id === 'overview';
  $('tabs').hidden = !showPageControls;
  $('sizeSeg').hidden = !isDetail;
  $('actual').hidden = !isDetail || state.mode === 'phone';
  $('vsField').hidden = !isDetail;
  $('m-desktop').setAttribute('aria-pressed', state.mode === 'desktop');
  $('m-phone').setAttribute('aria-pressed', state.mode === 'phone');
  $('actual').setAttribute('aria-pressed', state.actual);
  $('pick').value = id;
  $('vs').value = state.vs;
  applyPos();
  document.title = (isDetail ? BY[id].name + ' · ' : id === 'modes' ? 'Modes compared · ' : id === 'scores' ? 'Scoreboard · ' : '') + 'Phosphor Concept Viewer';
}

function step(n) {
  if (VIEWS.includes(state.id)) return go({id: order[n > 0 ? 0 : order.length - 1]});
  const i = (order.indexOf(state.id) + n + order.length) % order.length;
  go({id: order[i]});
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (a) { e.preventDefault(); go({id: a.dataset.go}); return; }
  const t = e.target.closest('[data-page]'); if (t) { go({page: t.dataset.page}); return; }
  const s = e.target.closest('[data-step]'); if (s) { step(Number(s.dataset.step)); return; }
  const g = e.target.closest('[data-group]'); if (g) { state.group = g.dataset.group; render(); return; }
  const b = e.target.closest('[data-by]'); if (b) { state.by = b.dataset.by; render(); return; }
  const so = e.target.closest('[data-sort]');
  if (so) { const k = so.dataset.sort; if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = (k === 'name' || k === 'rank' || k === 'mode' || k === 'look' || k === 'medium' || k === 'nav' || k === 'fonts') ? 1 : -1; } render(); }
});
function tip(e) {
  const d = e.target.closest && e.target.closest('.dot'), r = $('readout');
  if (d && r) r.textContent = d.dataset.tip;
}
document.addEventListener('mouseover', tip);
document.addEventListener('focusin', tip);
$('m-desktop').addEventListener('click', () => go({mode: 'desktop'}));
$('m-phone').addEventListener('click', () => go({mode: 'phone'}));
$('actual').addEventListener('click', () => { state.actual = !state.actual; render(); });
$('pick').addEventListener('change', e => go({id: e.target.value}));
$('vs').addEventListener('change', e => go({vs: e.target.value}));
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (/^[1-7]$/.test(e.key)) go({page: PAGES[Number(e.key) - 1][0]});
  else if (e.key === 'p' || e.key === 'P') go({mode: state.mode === 'phone' ? 'desktop' : 'phone'});
  else if (e.key === 'o' || e.key === 'O') go({id: 'overview'});
});

buildStatic();
parse(location.hash);
render();
</script>
