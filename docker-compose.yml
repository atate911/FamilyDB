services:
  bot:
    build: .
    image: familydb:local
    env_file:
      - path: .env
        required: false
    environment:
      FAMILYDB_PATH: /data/familydb.sqlite3
      GOOGLE_KEY_PATH: /data/google_key.json
      # The page binds every interface inside the container; the ports mapping decides who
      # reaches it. WEB_PORT in .env moves it inside and out (`maintain.sh port` sets it).
      WEB_HOST: 0.0.0.0
      WEB_PORT: ${WEB_PORT:-8080}
    volumes:
      # The host folder must be writable by uid 1000 (the container's familydb user).
      - ./data:/data
    ports:
      # This machine only. Drop 127.0.0.1 for the local network (with WEB_PASSWORD set); on a
      # public server keep it and use the tls profile.
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    restart: unless-stopped
    init: true
    # Uncapped, the json log fills a small VPS's disk and takes the bot with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional HTTPS; needs WEB_DOMAIN pointing here. `docker compose --profile tls up -d`, or
  # COMPOSE_PROFILES=tls in .env (the installer writes it). WEB_TRUST_PROXY=true in .env reads the
  # visitor address and scheme from Caddy's headers and marks the login cookie Secure.
  # WEB_PUBLIC_PORT serves the page on a port other than 443; 80 stays open for the certificate
  # authority's check, and Caddy's redirect from 80 then points at 443, where nothing answers.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    depends_on:
      - bot
    ports:
      - "80:80"
      - "${WEB_PUBLIC_PORT:-443}:443"
    command: caddy reverse-proxy --from ${WEB_DOMAIN:-localhost} --to bot:${WEB_PORT:-8080}
    volumes:
      # Not ./data: the bot's container must not read the certificate key, nor copies of data/ carry it.
      - ./caddy:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
