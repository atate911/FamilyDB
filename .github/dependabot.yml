# Monthly: Python packages (uv.lock), Actions and Docker images. The SDKs change with the
# companies' APIs, so a month is as long as is safe; CI tests each pull request.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # The minor and patch releases together, one pull request; a major release (a new SDK
      # generation, which the bounds in pyproject.toml hold back) comes on its own.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
