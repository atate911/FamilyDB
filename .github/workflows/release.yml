name: Release

# Pushing a vN.N.N tag publishes the release. The notes are the matching section of
# CHANGELOG.md, so the file in the repo and the release page cannot drift apart.
on:
  push:
    tags: ["v*"]
  # Also by hand, for anyone who cannot push a tag from where they are working. The tag is then
  # made by GitHub at the commit this runs on, which is the commit the release describes.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string
      move_existing:
        description: >
          Move this version to the commit being released, deleting the release and the tag
          that are there now. Only for a version nobody has installed yet.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which version this is
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: The version must look like a version, and match pyproject.toml
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'
          packaged=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION packaged=$packaged"
          test "${VERSION#v}" = "$packaged"
      - name: Take the notes from the changelog
        run: |
          awk -v want="## ${VERSION} " '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Make room, if this version is being moved
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.move_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Moving a version that people may already have installed is wrong: the same name
          # would mean two different trees. It is allowed here only because it has to be asked
          # for, one release at a time, and the answer is normally no.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            was=$(gh release view "$VERSION" --json targetCommitish -q .targetCommitish)
            echo "Moving ${VERSION} from ${was} to ${GITHUB_SHA}"
            gh release delete "$VERSION" --yes --cleanup-tag
          else
            echo "${VERSION} does not exist yet, so there is nothing to move."
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An alpha is a pre-release: it says plainly that this has not been lived with yet.
          # On a tag push the tag is already there and is checked; run by hand, GitHub makes it
          # at this commit.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file notes.md \
              --prerelease \
              --verify-tag
          fi
          gh release view "$VERSION" --json tagName,targetCommitish,isPrerelease,url
