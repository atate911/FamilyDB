name: Release

# Pushing a vN.N.N tag publishes the release. The notes are the matching section of
# CHANGELOG.md, so the file in the repo and the release page cannot drift apart.
on:
  push:
    tags: ["v*"]
  # Also by hand; GitHub then makes the tag at the commit this runs on.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string
      move_existing:
        description: >
          Move this version to the commit being released, deleting the release and the tag
          that are there now. Only for a version nobody has installed yet.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Which version this is
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: The version must look like a version, and match pyproject.toml
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'
          packaged=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION packaged=$packaged"
          test "${VERSION#v}" = "$packaged"
      - name: The version must be finished
        # A release is its tag and its notes; installs follow the default branch whatever is
        # tagged (scripts/lib/common.sh, wanted_version). Releasing means giving it a date first.
        run: |
          heading=$(grep -m1 "^## ${VERSION} " CHANGELOG.md || true)
          echo "$heading"
          test -n "$heading"
          if echo "$heading" | grep -qi 'in progress'; then
            echo "CHANGELOG.md still says ${VERSION} is in progress; give it a date to release it." >&2
            exit 1
          fi
      - name: Take the notes from the changelog
        run: |
          awk -v want="## ${VERSION} " '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Make room, if this version is being moved
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.move_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Moving an installed version means two trees under one name; only on explicit request.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            was=$(gh release view "$VERSION" --json targetCommitish -q .targetCommitish)
            echo "Moving ${VERSION} from ${was} to ${GITHUB_SHA}"
            gh release delete "$VERSION" --yes --cleanup-tag
          else
            echo "${VERSION} does not exist yet, so there is nothing to move."
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release is a pre-release while FamilyDB is an alpha. A pushed tag is checked;
          # by hand, GitHub makes it at this commit.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file notes.md \
              --prerelease \
              --verify-tag
          fi
          gh release view "$VERSION" --json tagName,targetCommitish,isPrerelease,url
