name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the project claims, and the one the Docker image runs.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Tests
        run: uv run pytest -q
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Shell syntax
        run: bash -n scripts/install.sh
      - name: Shellcheck every script
        run: shellcheck --severity=warning -x scripts/*.sh scripts/lib/*.sh
      - name: Every script explains itself
        run: |
          for s in bootstrap install uninstall maintain; do
            NO_COLOR=1 bash "scripts/$s.sh" --help > "/tmp/$s.help"
            test -s "/tmp/$s.help"
          done
      - name: A bootstrap dry run changes nothing
        run: |
          NO_COLOR=1 bash scripts/bootstrap.sh --dry-run --yes --from "$PWD" | tee /tmp/boot.log
          grep -q "What this will change on this machine" /tmp/boot.log
          grep -q "It does not touch" /tmp/boot.log
          test ! -e /opt/familydb
      - name: A dry run changes nothing
        run: |
          scripts/install.sh --dry-run --non-interactive --mode venv
          test ! -e .env
      - name: An install from a home directory refuses to leave a unit that cannot start
        # The checkout is under /home/runner here, which other users cannot enter, so the
        # service user could never run from it. Say so rather than install a broken unit.
        env:
          ADMIN_NAME: Sam
          FAMILYDB_TZ: America/Vancouver
          NO_COLOR: "1"
        run: |
          scripts/install.sh --non-interactive --mode venv 2>&1 | tee out.log
          grep -q "cannot get into" out.log
          test ! -f /etc/systemd/system/familydb.service
          .venv/bin/familydb config > /dev/null       # still usable by whoever installed it
          .venv/bin/familydb members list | grep -q Sam
      - name: The documented install, in /opt, is complete
        # Through bootstrap.sh, which is what docs/INSTALL.md tells people to run: it is the
        # only path that makes uv reachable by the service account as well as by the installer.
        env:
          ADMIN_NAME: Sam
          FAMILYDB_TZ: America/Vancouver
          NO_COLOR: "1"
        run: |
          sudo -E bash scripts/bootstrap.sh --from "$PWD" --yes --non-interactive --no-start
          test -x /usr/local/bin/uv     # installed where every account can see it
          cd /opt/familydb
          test -f /etc/systemd/system/familydb.service
          test "$(stat -c %a /etc/systemd/system/familydb.service)" = 644
          grep -q "^WorkingDirectory=/opt/familydb$" /etc/systemd/system/familydb.service
          # data/ and .env belong to the service now, so that is the account that must work.
          sudo -u familydb /opt/familydb/.venv/bin/familydb config > /dev/null
          sudo -u familydb /opt/familydb/.venv/bin/familydb db status > /dev/null
          sudo -u familydb /opt/familydb/.venv/bin/familydb members list | grep -q Sam
          test "$(stat -c %U /opt/familydb/.env)" = familydb
      - name: The service starts under its hardening, serves the page, and keeps its files private
        # The install above stops short of starting it; this is the part a hardening line in the
        # unit could break, and nothing else runs the unit under a real systemd.
        run: |
          cd /opt/familydb
          printf "WEB_ENABLED=true\nWEB_PASSWORD='a long enough password'\n" | sudo tee -a .env > /dev/null
          sudo systemctl start familydb
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          sudo journalctl -u familydb --no-pager | tail -20
          curl -sf http://127.0.0.1:8080/healthz | grep -q ok
          systemctl is-active familydb
          test "$(sudo stat -c %a data/familydb.sqlite3)" = 600
          test "$(sudo stat -c %a data)" = 700
          sudo systemctl stop familydb
      - name: The example config is a working config
        run: |
          cd /opt/familydb
          sudo rm -f .env
          sudo cp .env.example .env
          sudo chown familydb .env
          sudo -u familydb /opt/familydb/.venv/bin/familydb config > /dev/null
      - name: doctor reports, and --fix puts right what it can
        run: |
          cd /opt/familydb
          sudo chmod 644 .env
          sudo -u familydb .venv/bin/familydb doctor --json > /tmp/doctor.json || true
          python3 -c "import json;d=json.load(open('/tmp/doctor.json'));print(d['failures'],'failures')"
          sudo .venv/bin/familydb doctor --fix > /tmp/fixed.log || true
          test "$(stat -c %a .env)" = 600
      - name: maintain.sh reports status and takes a backup
        run: |
          cd /opt/familydb
          sudo scripts/maintain.sh status | tee /tmp/status.log
          grep -q "Database:" /tmp/status.log
          sudo scripts/maintain.sh backup --yes | tee /tmp/backup.log
          grep -q "Backup:" /tmp/backup.log
          test -n "$(find /opt/familydb/backups -name 'familydb-*.sqlite3')"
      - name: A backup can be restored over the database
        run: |
          cd /opt/familydb
          backup=$(find /opt/familydb/backups -name 'familydb-*.sqlite3' | head -1)
          sudo scripts/maintain.sh restore "$backup" --yes
          sudo -u familydb .venv/bin/familydb db status | grep -q "schema version"
      - name: uninstall refuses a directory that is not an install
        run: |
          ! sudo scripts/uninstall.sh --target /usr 2>&1 | tee /tmp/refuse.log
          grep -q "system directory" /tmp/refuse.log
      - name: uninstall keeps the data, and an install picks it back up
        run: |
          cd /opt/familydb
          sudo scripts/uninstall.sh --target /opt/familydb --yes | tee /tmp/uninstall.log
          grep -q "It does not touch" /tmp/uninstall.log
          test ! -e /opt/familydb/.venv      # the install is gone
          test -f /opt/familydb/data/familydb.sqlite3   # the data is not
          sudo scripts/install.sh --non-interactive --mode venv
          sudo -u familydb .venv/bin/familydb members list | grep -q Sam
          sudo -u familydb .venv/bin/familydb doctor --json > /dev/null || true
      - name: purge removes everything, and backs it up first
        run: |
          cd /opt/familydb
          sudo scripts/uninstall.sh --target /opt/familydb --purge --force \
            --backup-to /tmp/familydb-final | tee /tmp/purge.log
          test -n "$(find /tmp/familydb-final -name 'familydb-*.sqlite3')"
          test ! -e /opt/familydb/.env
          test ! -e /opt/familydb/data
          ! id familydb 2>/dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose file is valid
        run: docker compose config > /dev/null
      - name: Build the image
        run: docker compose build
      - name: Migrate and inspect inside the container
        run: |
          mkdir -p data && sudo chown -R 1000:1000 data
          docker compose run --rm -T bot familydb db migrate
          docker compose run --rm -T bot familydb members add Sam --role admin
          docker compose run --rm -T bot familydb members list | grep -q Sam
          docker compose run --rm -T bot familydb config > /dev/null
          docker compose run --rm -T bot familydb tool --list > /dev/null
      - name: The database landed on the mounted volume, not inside the container
        run: test -f data/familydb.sqlite3
      - name: Docker backup and restore preserve data and container ownership
        run: |
          sudo bash scripts/maintain.sh backup --yes --backup-dir "$PWD/test-backups"
          backup=$(find "$PWD/test-backups" -name 'familydb-*.sqlite3' | head -1)
          test -s "$backup"
          docker compose run --rm -T bot familydb members add Temporary
          sudo bash scripts/maintain.sh restore "$backup" --yes --backup-dir "$PWD/test-backups"
          docker compose run --rm -T bot familydb members list | grep -q Sam
          ! docker compose run --rm -T bot familydb members list | grep -q Temporary
          test "$(stat -c %u data/familydb.sqlite3)" = 1000
          test "$(stat -c %a data/familydb.sqlite3)" = 600
          docker compose down
      - name: It starts, serves the page and stops on a signal
        run: |
          printf 'WEB_ENABLED=true\nWEB_PASSWORD=%s\n' "'a long enough password'" >> .env
          docker compose up -d
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz | grep -q ok
          curl -si http://127.0.0.1:8080/ | grep -q "Location: /login"
          docker compose logs bot | tail -20
          docker compose logs bot | grep -q "serving the web page"
          timeout 30 docker compose stop bot
          docker compose down
