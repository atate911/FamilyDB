# HTTPS in front of the web page with nginx, for a virtualenv install. Caddy, which the installer
# sets up by itself, needs less, since it fetches its own certificate; use this if nginx is
# already there, and install with --local-only so the installer leaves ports 80 and 443 to it.
#
#   sudo cp deploy/nginx-familydb.conf /etc/nginx/sites-available/familydb
#   sudo sed -i 's/familydb.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/familydb
#   sudo ln -s /etc/nginx/sites-available/familydb /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d YOUR.DOMAIN      # fills in the certificate lines below
#   sudo nginx -t && sudo systemctl reload nginx
#
# and in the bot's .env: WEB_HOST=127.0.0.1, WEB_TRUST_PROXY=true and a WEB_PASSWORD of at
# least twelve characters. The bot trusts exactly one proxy hop and reads the last address in
# X-Forwarded-For, which is the one nginx appends, so a visitor cannot pass as someone else.
server {
    listen 80;
    server_name familydb.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name familydb.example.com;
    ssl_certificate     /etc/letsencrypt/live/familydb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familydb.example.com/privkey.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # $http_host, not $host: $host drops the port, and the page checks each form's Origin
        # (which keeps it) against this, so a site on any port but 443 could not sign anyone in.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A chat turn can take the better part of a minute; the page itself answers at once.
        proxy_read_timeout 90s;
    }
}
